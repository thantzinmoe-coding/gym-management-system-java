# Copy to application-dev.yaml (git-ignored) and fill in your own local values.
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/gym_management_system_db?createDatabaseIfNotExist=true
    username: <your-username>
    password: <your-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # Start with only 1 or 2 connections to speed up the boot
      minimum-idle: 1
      maximum-pool-size: 5
      # Increase timeout so it doesn't give up if the cloud is slow
      connection-timeout: 30000
      # Helps skip some initial metadata checks
      initialization-fail-timeout: 0

  main:
    lazy-initialization: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    generate-ddl: false
    database-platform: org.hibernate.dialect.MySQL8Dialect
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  data:
    mongodb:
      uri: <your-uri>
    redis:
      host: localhost
      port: 6379
      password: <your-password>
      ssl:
        enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: <your-username>
    password: <your-password>
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 15000
          timeout: 15000
          writetimeout: 15000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

jwt:
  secret: <your-secret>
