spring.application.name=gym_management_system
spring.docker.compose.enabled=false

spring.profiles.active=prod

api.base.path=/api/v1

spring.jpa.hibernate.ddl-auto=update

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


spring.jpa.hibernate.naming.physical-strategy=org.java_proj.gym_management_system.common.jpa.PluralPhysicalNamingStrategy

# Internal churn/recommendation service (gym-ml-service). Never exposed to browsers.
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.api-key=${ML_API_KEY:}

# Browser origins allowed to call the API and open the chat WebSocket. localhost and
# 127.0.0.1 are different origins to a browser, so both are listed.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3001,http://127.0.0.1:3001,https://gym-management-system-react-eight.vercel.app}
