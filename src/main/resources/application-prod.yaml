spring:
  datasource:
    url: ${AIVEN_DB_URL}
    username: ${AIVEN_DB_USERNAME}
    password: ${AIVEN_DB_PASSWORD}
    hikari:
      # Limit connection pool to reduce memory usage (~1-2MB per connection)
      minimum-idle: 2
      maximum-pool-size: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 900000

  # Lazy-load beans to reduce startup memory spike
  main:
    lazy-initialization: true

  jpa:
    hibernate:
      # "validate" refuses to start when the schema does not match the entities. A brand-new,
      # empty database has no tables: deploy once with DDL_AUTO=update to create them, then
      # remove the variable so it goes back to validate.
      ddl-auto: ${DDL_AUTO:validate}
    # Disable SQL logging in production to save memory on log buffers
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Batch fetching to reduce N+1 queries (fewer objects in memory at once)
        default_batch_fetch_size: 16
        # Use second-level cache conservatively
        jdbc:
          batch_size: 15

  # Explicit session config to avoid silent auto-config issues
  session:
    store-type: redis
    redis:
      flush-mode: on_save
      namespace: gym:session

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USER:default} # Redis Cloud uses the "default" ACL user
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:false}
      # Limit Redis connection pool
      lettuce:
        pool:
          max-active: 4
          max-idle: 2
          min-idle: 1

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD:unused}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

  # Limit file upload sizes to prevent memory exhaustion
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB


# Bind to Railway's dynamic PORT (defaults to 8080 if not set)
server:
  port: ${PORT:8080}
  # Behind Railway's HTTPS proxy: build https:// links (image URLs) instead of http://
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 25
      min-spare: 2
    max-connections: 100
    accept-count: 25

jwt:
  secret: ${JWT_SECRET}

# Where uploaded pictures are stored. Mount a Railway volume and set UPLOAD_DIR to its path (e.g. /data/uploads),
# otherwise uploads disappear on every deploy.
app:
  upload-dir: ${UPLOAD_DIR:upload-dir}

# Brevo HTTP API Configuration (bypasses Railway outbound SMTP port blocks)
brevo:
  api-key: ${BREVO_API_KEY}
  sender-email: ${SMTP_USERNAME}
  sender-name: ${BREVO_SENDER_NAME:Gym Management System}

# Reduce logging in production
logging:
  level:
    root: WARN
    org.java_proj.gym_management_system: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
    org.springframework: WARN

# API docs are public routes: keep them off in production unless you set SWAGGER_ENABLED=true.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

# First administrator, created at startup only when no admin exists yet. Set both variables
# for the first deploy, sign in, then remove them. (Sign-up can never create an admin.)
app:
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}